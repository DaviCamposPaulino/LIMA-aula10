<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexbox</title>
<style>
    .conteiner{
        display: flex;
        gap: 10px;
        justify-content: center;
        align-content:center;
    }

    .item{
       background-color: salmon;
       margin: 10px;
       border-radius: 5px;
       color: aliceblue;
       font-size: 20px;
       width: 100px;
       height: 100px;
       order:3;
       align-self: baseline;
    }
    .item2{
        background-color: blueviolet;
        order: 1;
    }
    .item3{
        background-color: lightblue;
        order: 2;
    }
</style>
</head>
<body>
    <div class="conteiner">
        <div class="item">1</div>
        <div class="item">2</div>
        <div class="item">3</div>
        <div class="item">4</div>
    </div>
</body>
</html>
