<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Layout</title>

    <style>
        body {
            margin: 20px;
            font-family: Arial;
        }

        header, footer {
            background-color:rgb(4, 92, 255);
            text-align: center;
            padding: 15px;
            margin-bottom: 8px;
        }

        .container {
            display: flex;
            gap: 8px;
            height: 370px;
            margin-bottom: 8px;
        }

        aside {
            background-color: rgb(0, 225, 255);
            width: 25%;
        }

        main {
            background-color: rgb(127, 150, 255);
            width: 50%;
        }

        p {
            margin: 5px;
        }
    </style>
</head>

<body>

    <header>Header</header>

    <div class="container">

        <aside>
            <p>lateral</p>
        </aside>

        <main>
            <p>Meio</p>
        </main>

        <aside>
            <p>lateral</p>

    </div>

    <footer>Rodapeeeeé</footer>

</body>
</html>
